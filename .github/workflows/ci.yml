name: BerMap validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bermap_ci
          POSTGRES_PASSWORD: bermap_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bermap_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BERMAP_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=bermap_ci;Password=bermap_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/BerMap.Web/package-lock.json
      - run: dotnet build BerMap.slnx -c Release
      - run: dotnet test BerMap.slnx -c Release --no-build
      - run: dotnet list BerMap.slnx package --vulnerable --include-transitive
      - run: npm ci
        working-directory: src/BerMap.Web
      - run: npm run lint
        working-directory: src/BerMap.Web
      - run: npm run build
        working-directory: src/BerMap.Web
